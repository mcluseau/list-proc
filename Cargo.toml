[package]
name = "list-proc"
version = "0.1.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = true
debug = false
panic = "abort"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.35"
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "signal", "rt", "io-util", "process", "macros", "sync"] }
